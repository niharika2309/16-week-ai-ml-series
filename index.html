<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI, One Concept at a Time — a 16-week book</title>
    <meta
      name="description"
      content="A beginner-friendly 16-week journey into Artificial Intelligence and Machine Learning — one concept at a time. By Niharika Batra."
    />
    <!-- Docsify core theme (vendored from docsify@5.0.0 — the npm package has no "default.css", so load the real one) -->
    <link rel="stylesheet" href="lib/themes/core.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="app-loading">Loading the book…</div>
    </div>
    <script>
      window.$docsify = {
        name: 'AI, One Concept at a Time',
        repo: '',
        // GitHub Pages project page: the site lives under /16-week-ai-ml-series/
        // (repo renamed from niharika2309.github.io). Docsify prefixes all routes,
        // file fetches and rewritten asset paths with this base.
        basePath: '/16-week-ai-ml-series/',
        coverpage: '_coverpage.md',
        loadSidebar: true,
        auto2top: true, // start each article from the top on next/prev and link navigation
        externalLinkTarget: '_blank',
        externalLinkRel: 'noopener',
        maxLevel: 3,
        subMaxLevel: 2,
        // docsify v5 search: object form. (The old v4-style ['/title','/text'] array
        // would be treated as path prefixes and crash the index build.)
        search: {
          placeholder: 'Search the book…',
          noData: 'No results.',
        },
        plugins: [
          // simple prev/next navigation using the generated book-pages.js
          function bookNav(lifecycle, vm) {
            lifecycle.afterEach((content, callback) => {
              const pages = window.BOOK_PAGES || []
              if (!pages.length) return callback(content)
              const norm = (s) => String(s).replace(/\.md$/, '').replace(/\/index$/, '')
              const cur = norm(vm.route.file || vm.route.path || '')
              const idx = pages.findIndex((p) => norm(p.file) === cur)
              if (idx === -1) return callback(content)
              const prev = idx > 0 ? pages[idx - 1] : null
              const next = idx < pages.length - 1 ? pages[idx + 1] : null
              const link = (p, dir) =>
                p
                  ? `<a class="book-nav-link" href="#/${p.file.replace(/\.md$/, '')}"><span class="book-nav-dir">${
                      dir === 'prev' ? '← Previous' : 'Next →'
                    }</span><span class="book-nav-label">${p.label}</span></a>`
                  : '<span class="book-nav-empty"></span>'
              callback(content + `<nav class="book-nav">${link(prev, 'prev')}${link(next, 'next')}</nav>`)
            })
          },
        ],
      }
    </script>
    <!-- Vendored locally so the site has no CDN dependency (unpkg can be blocked/unreliable).
         IMPORTANT: docsify.min.js is the v5.0.0 DIST build (package/dist/), which pairs
         with the dist core.min.css theme above. The package's legacy lib/ build uses a
         different sidebar mechanism (body.close vs .sidebar.show) and would make the
         sidebar invisible and un-toggleable with this theme. Do not swap in the lib build. -->
    <script src="lib/docsify.min.js"></script>
    <script src="lib/plugins/search.js"></script>
    <script src="book-pages.js"></script>
  </body>
</html>
